<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login - JobConnect</title>
  <link rel="stylesheet" href="css/normalize.css" />
  <link rel="stylesheet" href="css/global.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>
<body>

  <section>
    <div class="header-section">
      <header>
        <div class="navbar-logo">
          <a href="dashboard.html">JobConnect</a>
        </div>
        <button class="menu" id="menu-toggle">&#9776;</button>
      </header>
    </div>

    <div class="nav-section">
      <nav>
        <div class="nav"> 
          <ul class="navbar-links">
            <li><a href="job-listing.html" class="nav-a">Job Listing</a></li>
            <li><a href="apply.html" class="nav-a">Apply</a></li>
            <li><a href="dashboard.html" class="nav-a">Dashboard</a></li>
            <li><a href="login.html" class="nav-a">Login</a></li>
          </ul>
        </div>
      </nav>
    </div>
  </section>

  <main class="login-container">
    <h1 class="login-title">Login to JobConnect</h1>

    <form class="login-form" id="login-form">
      <label for="email" class="form-label">Email</label>
      <input type="email" id="email" class="form-input" required />

      <label for="password" class="form-label">Password</label>
      <input type="password" id="password" class="form-input" required />

      <div class="form-links">
        <a href="#" class="form-link">Forgot Password?</a>
      </div>

      <button type="submit" class="btn btn-primary">Login</button>

      <p id="login-message" style="margin-top: 10px; font-weight: bold;"></p>
    </form>

    <div class="signup-link">
      <p>Don't have an account? <a href="#">Sign up</a></p>
    </div>
  </main>

  <footer class="footer">
    <div class="footer-container">
      <p class="footer-text">© 2025 JobConnect. All rights reserved.</p>
      <ul class="footer-links">
        <li><a href="#">Privacy Policy</a></li>
        <li><a href="#">Terms of Service</a></li>
        <li><a href="#">Contact</a></li>
      </ul>
    </div>
  </footer>

  <script src="./jc/login.js"></script>

</body>
</html>
