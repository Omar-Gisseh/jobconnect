<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Job Details</title>
  <link rel="stylesheet" href="./css/style.css" />
  <link rel="stylesheet" href="https://necolas.github.io/normalize.css/latest/normalize.css">
</head>
<body>
  <main>
    <section class="job-details-section">
      <div class="job-header">
        <h2 class="jobs-header" id="job-title">Loading...</h2>
        <p class="Company-name"><strong>Company:</strong> <span id="job-company"></span> </p>
        <p class="Company-location"><strong>Location:</strong> <span id="job-location"></span> </p>
        <div class="tags">
           <span class="tag" id="job-type"></span>
          <span class="tag" id="job-mode"></span>
           <span class="tag" id="job-level"></span>
        </div>
        <a href="apply.html" class="apply-btn">Apply Now</a>
      </div>

      <div class="job-description">
        <h3>Job Description</h3>
        <p id="job-description">Loading...</p>

        <h3>Requirements</h3>
        <ul class="requirements-list" id="job-requirements"></ul>

        <h3>Perks & Benefits</h3>
        <ul class="perks-list"  id="job-benefits"></ul>
      </div>
    </section>
  </main>

  <script src="./jc/job-detail.js"></script>
</body>
</html>
